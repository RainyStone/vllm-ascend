<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="chunk-phase-title chunk-phase-desc"><title id="chunk-phase-title">相同的两轮初始偏移，切 chunk 改变了它与周期的关系</title><desc id="chunk-phase-desc">示意固定两轮初始偏移的影响。横向为 forward 顺序，不按真实耗时等比例绘制；后续 P / P1 / P2 属于连续的新请求。</desc><defs><marker id="chunk-phase-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#71859a"/></marker></defs><rect width="1000" height="670" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="26" y="36" font-size="25" fill="#17334f" text-anchor="start" font-weight="700">同样晚两轮开始：不切分能重新同相，切两块却持续错位</text><text x="26" y="66" font-size="17" fill="#536b81" text-anchor="start" font-weight="400">P = 完整 16K prefill；P1 / P2 = 各 8K chunk；D = 本地无真实 token 的 dummy</text><rect x="20" y="100" width="960" height="244" rx="8" fill="#f8fafc" stroke="#dce5ef"/><text x="38" y="131" font-size="21" fill="#17334f" text-anchor="start" font-weight="700">A  16K 输入 / 16K 预算：P → D，周期为 2</text><text x="223" y="163" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">1</text><text x="314" y="163" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">2</text><text x="405" y="163" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">3</text><text x="496" y="163" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">4</text><text x="587" y="163" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">5</text><text x="678" y="163" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">6</text><text x="769" y="163" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">7</text><text x="860" y="163" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">8</text><text x="40" y="163" font-size="16" fill="#536b81" text-anchor="start" font-weight="400">全局轮次 →</text><text x="40" y="207" font-size="18" fill="#17334f" text-anchor="start" font-weight="700">先到 rank</text><text x="40" y="262" font-size="18" fill="#17334f" text-anchor="start" font-weight="700">其余 3 rank</text><rect x="182" y="177" width="82" height="42" rx="5" fill="#dcefe7"/><text x="223.0" y="205.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P</text><rect x="273" y="177" width="82" height="42" rx="5" fill="#edf0f4"/><text x="314.0" y="205.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="364" y="177" width="82" height="42" rx="5" fill="#dcefe7"/><text x="405.0" y="205.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P</text><rect x="455" y="177" width="82" height="42" rx="5" fill="#edf0f4"/><text x="496.0" y="205.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="546" y="177" width="82" height="42" rx="5" fill="#dcefe7"/><text x="587.0" y="205.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P</text><rect x="637" y="177" width="82" height="42" rx="5" fill="#edf0f4"/><text x="678.0" y="205.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="728" y="177" width="82" height="42" rx="5" fill="#dcefe7"/><text x="769.0" y="205.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P</text><rect x="819" y="177" width="82" height="42" rx="5" fill="#edf0f4"/><text x="860.0" y="205.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="182" y="232" width="82" height="42" rx="5" fill="#edf0f4"/><text x="223.0" y="260.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="273" y="232" width="82" height="42" rx="5" fill="#edf0f4"/><text x="314.0" y="260.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="364" y="232" width="82" height="42" rx="5" fill="#dcefe7"/><text x="405.0" y="260.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P</text><rect x="455" y="232" width="82" height="42" rx="5" fill="#edf0f4"/><text x="496.0" y="260.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="546" y="232" width="82" height="42" rx="5" fill="#dcefe7"/><text x="587.0" y="260.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P</text><rect x="637" y="232" width="82" height="42" rx="5" fill="#edf0f4"/><text x="678.0" y="260.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="728" y="232" width="82" height="42" rx="5" fill="#dcefe7"/><text x="769.0" y="260.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P</text><rect x="819" y="232" width="82" height="42" rx="5" fill="#edf0f4"/><text x="860.0" y="260.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><path d="M355 171 V283" stroke="#aa6770" stroke-width="2" stroke-dasharray="5 5"/><text x="362" y="304" font-size="16" fill="#a6333c" text-anchor="start" font-weight="400">↑ 其余 rank 第 3 轮才开始真实请求</text><text x="40" y="330" font-size="18" fill="#086454" text-anchor="start" font-weight="700">2 mod 2 = 0 → 从第 3 轮起同相</text><rect x="20" y="363" width="960" height="244" rx="8" fill="#f8fafc" stroke="#dce5ef"/><text x="38" y="394" font-size="21" fill="#17334f" text-anchor="start" font-weight="700">B  16K 输入 / 8K 预算：P1 → P2 → D，周期为 3</text><text x="223" y="426" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">1</text><text x="314" y="426" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">2</text><text x="405" y="426" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">3</text><text x="496" y="426" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">4</text><text x="587" y="426" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">5</text><text x="678" y="426" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">6</text><text x="769" y="426" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">7</text><text x="860" y="426" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">8</text><text x="40" y="426" font-size="16" fill="#536b81" text-anchor="start" font-weight="400">全局轮次 →</text><text x="40" y="470" font-size="18" fill="#17334f" text-anchor="start" font-weight="700">先到 rank</text><text x="40" y="525" font-size="18" fill="#17334f" text-anchor="start" font-weight="700">其余 3 rank</text><rect x="182" y="440" width="82" height="42" rx="5" fill="#dcefe7"/><text x="223.0" y="468.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="273" y="440" width="82" height="42" rx="5" fill="#deebfa"/><text x="314.0" y="468.0" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="364" y="440" width="82" height="42" rx="5" fill="#edf0f4"/><text x="405.0" y="468.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="455" y="440" width="82" height="42" rx="5" fill="#dcefe7"/><text x="496.0" y="468.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="546" y="440" width="82" height="42" rx="5" fill="#deebfa"/><text x="587.0" y="468.0" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="637" y="440" width="82" height="42" rx="5" fill="#edf0f4"/><text x="678.0" y="468.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="728" y="440" width="82" height="42" rx="5" fill="#dcefe7"/><text x="769.0" y="468.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="819" y="440" width="82" height="42" rx="5" fill="#deebfa"/><text x="860.0" y="468.0" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="182" y="495" width="82" height="42" rx="5" fill="#edf0f4"/><text x="223.0" y="523.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="273" y="495" width="82" height="42" rx="5" fill="#edf0f4"/><text x="314.0" y="523.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="364" y="495" width="82" height="42" rx="5" fill="#dcefe7"/><text x="405.0" y="523.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="455" y="495" width="82" height="42" rx="5" fill="#deebfa"/><text x="496.0" y="523.0" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="546" y="495" width="82" height="42" rx="5" fill="#edf0f4"/><text x="587.0" y="523.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="637" y="495" width="82" height="42" rx="5" fill="#dcefe7"/><text x="678.0" y="523.0" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="728" y="495" width="82" height="42" rx="5" fill="#deebfa"/><text x="769.0" y="523.0" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="819" y="495" width="82" height="42" rx="5" fill="#edf0f4"/><text x="860.0" y="523.0" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><path d="M355 434 V546" stroke="#aa6770" stroke-width="2" stroke-dasharray="5 5"/><text x="362" y="567" font-size="16" fill="#a6333c" text-anchor="start" font-weight="400">↑ 其余 rank 第 3 轮才开始真实请求</text><text x="40" y="593" font-size="18" fill="#a6333c" text-anchor="start" font-weight="700">2 mod 3 = 2 → 稳态反复出现真实 / dummy 混合</text><text x="26" y="643" font-size="20" fill="#17334f" text-anchor="start" font-weight="700">每轮通信顺序一致，不代表每个 rank 的请求阶段一致。</text></g></svg>