<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="kv-gap-title kv-gap-desc"><title id="kv-gap-title">先调度、后回收输出，使 KV 已释放的这一轮仍然执行 dummy</title><desc id="kv-gap-desc">本次 9GiB KV、异步 batch queue、输出 1 token 配置的调度链。D 并不是额外的正常 decode。</desc><defs><marker id="kv-gap-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#71859a"/></marker></defs><rect width="1000" height="390" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="26" y="36" font-size="25" fill="#17334f" text-anchor="start" font-weight="700">这一个 D，从哪里来？</text><text x="26" y="65" font-size="18" fill="#536b81" text-anchor="start" font-weight="400">请求 A 的最后一块在途；请求 B 已在等待队列。</text><rect x="24" y="106" width="168" height="145" rx="8" fill="#deebfa"/><text x="108" y="139" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">① 先 schedule()</text><text x="108" y="179" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">A 仍占 KV</text><text x="108" y="219" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">B 分配空间失败</text><path d="M194 178 L215 178" fill="none" stroke="#71859a" stroke-width="2" marker-end="url(#kv-gap-arrow)"/><rect x="220" y="106" width="168" height="145" rx="8" fill="#fff1ed"/><text x="304" y="139" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">② 得到空调度</text><text x="304" y="179" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">本轮真实 token = 0</text><text x="304" y="219" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">executed = False</text><path d="M390 178 L411 178" fill="none" stroke="#71859a" stroke-width="2" marker-end="url(#kv-gap-arrow)"/><rect x="416" y="106" width="168" height="145" rx="8" fill="#dcefe7"/><text x="500" y="139" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">③ 再消费 A 输出</text><text x="500" y="179" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">A 完成</text><text x="500" y="219" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">KV 此刻释放</text><path d="M586 178 L607 178" fill="none" stroke="#71859a" stroke-width="2" marker-end="url(#kv-gap-arrow)"/><rect x="612" y="106" width="168" height="145" rx="8" fill="#fff1ed"/><text x="696" y="139" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">④ 本轮不重新调度</text><text x="696" y="179" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">executed 仍为 False</text><text x="696" y="219" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">于是执行 D</text><path d="M782 178 L803 178" fill="none" stroke="#71859a" stroke-width="2" marker-end="url(#kv-gap-arrow)"/><rect x="808" y="106" width="168" height="145" rx="8" fill="#deebfa"/><text x="892" y="139" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">⑤ 下次循环</text><text x="892" y="179" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">B 才分到 KV</text><text x="892" y="219" font-size="16" fill="#17334f" text-anchor="middle" font-weight="400">开始 B 的 P1</text><rect x="24" y="278" width="952" height="83" rx="8" fill="#f1f5fa"/><text x="500" y="311" font-size="21" fill="#17334f" text-anchor="middle" font-weight="700">因此：不切分为 P → D；切两块为 P1 → P2 → D。</text><text x="500" y="343" font-size="18" fill="#086454" text-anchor="middle" font-weight="400">20ms 补丁保留这个 D，让不同 rank 的 D 出现在同一轮。</text></g></svg>