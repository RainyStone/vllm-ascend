<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 905" role="img" aria-labelledby="fix-alignment-title fix-alignment-desc"><title id="fix-alignment-title">20ms 分词聚合窗口改变初始准入相位，使真实工作与 dummy 各自集中</title><desc id="fix-alignment-desc">本次突发负载的修复前后对照。重=至少一个 rank 有真实 8K 工作，轻=四个 rank 均 dummy；各重轮耗时并不相等。左侧分词时间来自一个默认窗口实测样本；下方为稳态机制示意，格宽不代表耗时。</desc><defs><marker id="fix-alignment-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#71859a"/></marker></defs><rect width="1000" height="905" fill="#ffffff"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="26" y="36" font-size="24" fill="#17334f" text-anchor="start" font-weight="700">20ms 补丁修复的是“何时一起开始”，并没有删除 dummy</text><rect x="24" y="62" width="456" height="758" rx="8" fill="#fff8f5" stroke="#dce5ef"/><text x="46" y="97" font-size="23" fill="#a6333c" text-anchor="start" font-weight="700">修复前：默认 2ms 窗口</text><text x="46" y="128" font-size="16" fill="#536b81" text-anchor="start" font-weight="400">首批 16 个文本请求，到达跨度约 11ms</text><rect x="46" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="71" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="96" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="121" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="146" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="171" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="196" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="221" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="246" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="271" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="296" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="321" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="346" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="371" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="396" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><rect x="421" y="147" width="21" height="25" rx="3" fill="#dcefe7"/><text x="46" y="202" font-size="16" fill="#17334f" text-anchor="start" font-weight="400">分词拆成 1 + 15 两批</text><text x="46" y="229" font-size="16" fill="#17334f" text-anchor="start" font-weight="400">约 40.2ms 释放 1 个；477.5ms 释放 15 个</text><path d="M252 245 L252 272" fill="none" stroke="#71859a" stroke-width="2" marker-end="url(#fix-alignment-arrow)"/><rect x="44" y="283" width="416" height="80" rx="8" fill="#ffffff" stroke="#dce5ef"/><text x="252" y="313" font-size="18" fill="#17334f" text-anchor="middle" font-weight="700">rank0 先获得真实请求</text><text x="252" y="342" font-size="18" fill="#17334f" text-anchor="middle" font-weight="700">其它 rank 迟到前已提交两轮 D</text><path d="M252 374 L252 398" fill="none" stroke="#71859a" stroke-width="2" marker-end="url(#fix-alignment-arrow)"/><text x="46" y="426" font-size="20" fill="#a6333c" text-anchor="start" font-weight="700">首次真实轮偏移：[0, 2, 2, 2]</text><text x="46" y="457" font-size="16" fill="#536b81" text-anchor="start" font-weight="400">稳态三轮 →</text><text x="199" y="457" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">1</text><text x="289" y="457" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">2</text><text x="379" y="457" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">3</text><text x="46" y="502" font-size="17" fill="#17334f" text-anchor="start" font-weight="400">rank 0</text><rect x="159" y="476" width="80" height="35" rx="5" fill="#dcefe7"/><text x="199.0" y="500.5" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="249" y="476" width="80" height="35" rx="5" fill="#deebfa"/><text x="289.0" y="500.5" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="339" y="476" width="80" height="35" rx="5" fill="#edf0f4"/><text x="379.0" y="500.5" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><text x="46" y="546" font-size="17" fill="#17334f" text-anchor="start" font-weight="400">rank 1</text><rect x="159" y="520" width="80" height="35" rx="5" fill="#deebfa"/><text x="199.0" y="544.5" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="249" y="520" width="80" height="35" rx="5" fill="#edf0f4"/><text x="289.0" y="544.5" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="339" y="520" width="80" height="35" rx="5" fill="#dcefe7"/><text x="379.0" y="544.5" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><text x="46" y="590" font-size="17" fill="#17334f" text-anchor="start" font-weight="400">rank 2</text><rect x="159" y="564" width="80" height="35" rx="5" fill="#deebfa"/><text x="199.0" y="588.5" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="249" y="564" width="80" height="35" rx="5" fill="#edf0f4"/><text x="289.0" y="588.5" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="339" y="564" width="80" height="35" rx="5" fill="#dcefe7"/><text x="379.0" y="588.5" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><text x="46" y="634" font-size="17" fill="#17334f" text-anchor="start" font-weight="400">rank 3</text><rect x="159" y="608" width="80" height="35" rx="5" fill="#deebfa"/><text x="199.0" y="632.5" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="249" y="608" width="80" height="35" rx="5" fill="#edf0f4"/><text x="289.0" y="632.5" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="339" y="608" width="80" height="35" rx="5" fill="#dcefe7"/><text x="379.0" y="632.5" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="159" y="669" width="80" height="40" rx="5" fill="#f5dcd5"/><text x="199" y="697" font-size="21" fill="#a6333c" text-anchor="middle" font-weight="700">重</text><rect x="249" y="669" width="80" height="40" rx="5" fill="#f5dcd5"/><text x="289" y="697" font-size="21" fill="#a6333c" text-anchor="middle" font-weight="700">重</text><rect x="339" y="669" width="80" height="40" rx="5" fill="#f5dcd5"/><text x="379" y="697" font-size="21" fill="#a6333c" text-anchor="middle" font-weight="700">重</text><text x="46" y="744" font-size="18" fill="#17334f" text-anchor="start" font-weight="700">每 3 轮都有真实 8K 工作</text><text x="46" y="775" font-size="18" fill="#17334f" text-anchor="start" font-weight="700">完整样本：25 轮均含真实负载</text><rect x="520" y="62" width="456" height="758" rx="8" fill="#f3faf6" stroke="#dce5ef"/><text x="542" y="97" font-size="23" fill="#086454" text-anchor="start" font-weight="700">修复后：20ms 聚合窗口</text><text x="542" y="128" font-size="16" fill="#536b81" text-anchor="start" font-weight="400">首批 16 个文本请求，到达跨度约 11ms</text><rect x="542" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="567" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="592" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="617" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="642" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="667" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="692" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="717" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="742" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="767" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="792" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="817" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="842" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="867" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="892" y="147" width="21" height="25" rx="3" fill="#deebfa"/><rect x="917" y="147" width="21" height="25" rx="3" fill="#deebfa"/><text x="542" y="202" font-size="16" fill="#17334f" text-anchor="start" font-weight="400">首批 16 个请求合为一批完成分词</text><text x="542" y="229" font-size="16" fill="#17334f" text-anchor="start" font-weight="400">聚合窗口 20ms ≠ 分词总耗时 20ms</text><path d="M748 245 L748 272" fill="none" stroke="#71859a" stroke-width="2" marker-end="url(#fix-alignment-arrow)"/><rect x="540" y="283" width="416" height="80" rx="8" fill="#ffffff" stroke="#dce5ef"/><text x="748" y="313" font-size="18" fill="#17334f" text-anchor="middle" font-weight="700">请求集中就绪，随后快速分发</text><text x="748" y="342" font-size="18" fill="#17334f" text-anchor="middle" font-weight="700">四个 rank 都赶上首轮真实调度</text><path d="M748 374 L748 398" fill="none" stroke="#71859a" stroke-width="2" marker-end="url(#fix-alignment-arrow)"/><text x="542" y="426" font-size="20" fill="#086454" text-anchor="start" font-weight="700">首次真实轮偏移：[0, 0, 0, 0]</text><text x="542" y="457" font-size="16" fill="#536b81" text-anchor="start" font-weight="400">稳态三轮 →</text><text x="695" y="457" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">1</text><text x="785" y="457" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">2</text><text x="875" y="457" font-size="16" fill="#536b81" text-anchor="middle" font-weight="400">3</text><text x="542" y="502" font-size="17" fill="#17334f" text-anchor="start" font-weight="400">rank 0</text><rect x="655" y="476" width="80" height="35" rx="5" fill="#dcefe7"/><text x="695.0" y="500.5" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="745" y="476" width="80" height="35" rx="5" fill="#deebfa"/><text x="785.0" y="500.5" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="835" y="476" width="80" height="35" rx="5" fill="#edf0f4"/><text x="875.0" y="500.5" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><text x="542" y="546" font-size="17" fill="#17334f" text-anchor="start" font-weight="400">rank 1</text><rect x="655" y="520" width="80" height="35" rx="5" fill="#dcefe7"/><text x="695.0" y="544.5" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="745" y="520" width="80" height="35" rx="5" fill="#deebfa"/><text x="785.0" y="544.5" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="835" y="520" width="80" height="35" rx="5" fill="#edf0f4"/><text x="875.0" y="544.5" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><text x="542" y="590" font-size="17" fill="#17334f" text-anchor="start" font-weight="400">rank 2</text><rect x="655" y="564" width="80" height="35" rx="5" fill="#dcefe7"/><text x="695.0" y="588.5" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="745" y="564" width="80" height="35" rx="5" fill="#deebfa"/><text x="785.0" y="588.5" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="835" y="564" width="80" height="35" rx="5" fill="#edf0f4"/><text x="875.0" y="588.5" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><text x="542" y="634" font-size="17" fill="#17334f" text-anchor="start" font-weight="400">rank 3</text><rect x="655" y="608" width="80" height="35" rx="5" fill="#dcefe7"/><text x="695.0" y="632.5" font-size="20" fill="#086454" text-anchor="middle" font-weight="700">P1</text><rect x="745" y="608" width="80" height="35" rx="5" fill="#deebfa"/><text x="785.0" y="632.5" font-size="20" fill="#245c9b" text-anchor="middle" font-weight="700">P2</text><rect x="835" y="608" width="80" height="35" rx="5" fill="#edf0f4"/><text x="875.0" y="632.5" font-size="20" fill="#627185" text-anchor="middle" font-weight="700">D</text><rect x="655" y="669" width="80" height="40" rx="5" fill="#dcefe7"/><text x="695" y="697" font-size="21" fill="#086454" text-anchor="middle" font-weight="700">重</text><rect x="745" y="669" width="80" height="40" rx="5" fill="#dcefe7"/><text x="785" y="697" font-size="21" fill="#086454" text-anchor="middle" font-weight="700">重</text><rect x="835" y="669" width="80" height="40" rx="5" fill="#edf0f4"/><text x="875" y="697" font-size="21" fill="#086454" text-anchor="middle" font-weight="700">轻</text><text x="542" y="744" font-size="18" fill="#17334f" text-anchor="start" font-weight="700">每 3 轮只有 2 轮含真实工作</text><text x="542" y="775" font-size="18" fill="#17334f" text-anchor="start" font-weight="700">完整样本：16 重轮 + 7 全 dummy</text><rect x="24" y="838" width="952" height="47" rx="8" fill="#deebfa"/><text x="500" y="869" font-size="20" fill="#17334f" text-anchor="middle" font-weight="700">真实 token 总量同为 524,288；补丁让 D 集中，保住跨 rank 并行度。</text></g></svg>